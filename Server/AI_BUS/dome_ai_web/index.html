<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Купол · ИИ-агенты</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="app"><header><div><h1>Купол · операционная среда ИИ-агентов</h1><p>Общий чат и живое состояние автономной системы</p></div><div id="connection" class="badge offline">нет соединения</div></header>
<main><section class="panel chat-panel"><div class="panel-title"><h2>Мультиагентный чат</h2><span id="messageCount">0 сообщений</span></div><div id="chat" class="chat"></div><button id="jump" class="jump">↓ К новым сообщениям</button><form id="composer"><input id="operatorInput" maxlength="2000" placeholder="Сообщение оператора…" autocomplete="off"><button>Отправить</button></form></section>
<aside class="panel"><div class="panel-title"><h2>Состояние купола</h2><span id="updated">ожидание данных</span></div><div id="cards" class="cards"></div></aside></main></div><script src="app.js"></script></body></html>
